name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancela runs anteriores del mismo PR para ahorrar minutos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Backend ───────────────────────────────────────────────────────────────

  backend-test:
    name: Backend — Tests & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: habita_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      DB_NAME: habita_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings.local

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/test.txt

      - name: Install dependencies
        run: pip install -r requirements/test.txt

      - name: Run tests with coverage
        run: coverage run manage.py test --verbosity=2

      - name: Coverage report
        run: coverage report --skip-covered --fail-under=60

  backend-typecheck:
    name: Backend — Type check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/local.txt

      - name: Install dependencies
        run: pip install -r requirements/local.txt

      - name: mypy
        run: mypy .

  backend-audit:
    name: Backend — Dependency audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit production dependencies
        run: pip-audit -r requirements/production.txt

  # ── Frontend ──────────────────────────────────────────────────────────────

  frontend-test:
    name: Frontend — Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

  frontend-build:
    name: Frontend — Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  frontend-audit:
    name: Frontend — Dependency audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # --audit-level=high ignora low/moderate; sube a critical si querés ser más estricto
        run: pnpm audit --audit-level=high

  # ── Seguridad ─────────────────────────────────────────────────────────────

  secret-scan:
    name: Security — Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  docker-scan:
    name: Security — Docker image scan (Trivy)
    runs-on: ubuntu-latest
    # Solo en push; en PRs no construimos imagen completa
    if: github.event_name == 'push'
    needs: [backend-test, backend-audit]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t habita-backend:${{ github.sha }} ./backend

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: habita-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  # ── Staging ───────────────────────────────────────────────────────────────

  smoke-test:
    name: Deploy — Smoke test staging
    runs-on: ubuntu-latest
    # Solo en push a main; requiere secreto STAGING_URL configurado
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend-test, frontend-build, docker-scan]

    steps:
      - name: Health check staging
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "⚠ STAGING_URL no configurado — smoke test omitido"
            exit 0
          fi
          echo "Verificando $STAGING_URL/api/v1/ ..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "$STAGING_URL/api/v1/" \
              -H "Accept: application/json" \
              --max-time 10)
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" -lt 500 ] && [ "$STATUS" -gt 0 ]; then
              echo "✓ Staging responde correctamente"
              exit 0
            fi
            sleep 10
          done
          echo "✗ Staging no responde después de 3 intentos"
          exit 1

  # ── Notificaciones ────────────────────────────────────────────────────────

  notify-failure:
    name: Notify — Slack on failure
    runs-on: ubuntu-latest
    # Solo notifica en push (no en PRs, GitHub ya notifica al autor)
    if: |
      failure() &&
      github.event_name == 'push'
    needs:
      - backend-test
      - backend-typecheck
      - backend-audit
      - frontend-test
      - frontend-build
      - frontend-audit
      - secret-scan
      - docker-scan

    steps:
      - name: Send Slack alert
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_WEBHOOK no configurado — notificación omitida"
            exit 0
          fi
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d '{
              "text": ":x: *CI falló* en `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver detalles>"
            }'
